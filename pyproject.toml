[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchclosure"
version = "0.1.0"
description = "Find residual exploits in incomplete web-security patches."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "The PatchClosure authors" }]
dependencies = ["tree-sitter-language-pack>=0.7"]

[project.optional-dependencies]
smt = ["z3-solver"]
graph = ["semgrep"]

[project.scripts]
patchclosure = "patchclosure.cli:main"

[tool.setuptools.packages.find]
include = ["patchclosure*"]
